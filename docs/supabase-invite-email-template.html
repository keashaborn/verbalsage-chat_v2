<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="format-detection"
      content="telephone=no,date=no,address=no,email=no,url=no"
    />
    <meta name="x-apple-disable-message-reformatting" />
    <style>
      a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: none !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <h2>Your LifeSwitch access was approved</h2>
    <p>Use this one-time code to finish setting up your account:</p>
    <p
      class="otp-code"
      style="font-family: monospace; font-size: 24px; font-weight: 700; letter-spacing: 0.2em; -webkit-user-select: all; user-select: all; cursor: text;"
    >{{ .Token }}</p>
    <p>Press and hold the code, choose Copy, then return to LifeSwitch.</p>
    <p><a href="{{ .SiteURL }}/auth/accept-invite?type=invite&amp;email={{ .Email }}">Continue to LifeSwitch</a></p>
    <p>If you did not request access, you can ignore this email.</p>
  </body>
</html>
